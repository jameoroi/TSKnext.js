name: Production health check

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_URL:-}" ]]; then
            echo 'PRODUCTION_URL secret is required' >&2
            exit 1
          fi
          base="${PRODUCTION_URL%/}"
          body_file="${RUNNER_TEMP}/health.json"
          status="$(curl --fail-with-body --silent --show-error --max-time 20 --retry 2 --output "${body_file}" --write-out '%{http_code}' -H "x-tsk-automation: ${AUTOMATION_TOKEN:-}" "${base}/api/health" || true)"
          healthy="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(x?.ok===true||x?.status==='healthy'||x?.health==='healthy'))}catch{process.stdout.write('false')}" "${body_file}")"
          if [[ "${status}" != '200' || "${healthy}" != 'true' ]]; then
            message="Production health check failed: HTTP ${status}; response=$(tr '\n' ' ' < "${body_file}" | cut -c1-500)"
            echo "::error::${message}"
            if [[ -n "${ALERT_WEBHOOK_URL:-}" ]]; then
              curl --silent --show-error --max-time 10 -X POST "${ALERT_WEBHOOK_URL}" \
                -H 'content-type: application/json' \
                --data "$(node -e 'process.stdout.write(JSON.stringify({text:process.argv[1]}))' "${message}")" || true
            fi
            exit 1
          fi
          echo "Production health is healthy (HTTP ${status})"
