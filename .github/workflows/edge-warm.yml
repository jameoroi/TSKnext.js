name: Edge cache warm

# Workers Free allows about 10 ms of CPU per request, so a full page render can
# end in "error code: 1102". cloudflare/worker-entry.js serves public pages from
# the edge cache and keeps a last-good copy in R2; this job makes sure the key
# pages always have one by requesting them until a render lands. A request that
# is answered from cache (HIT/STALE) costs the Worker almost nothing.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Warm key public pages
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          base="${PRODUCTION_URL:-https://jayxtsk.shop}"
          base="${base%/}"
          ua='Mozilla/5.0 (compatible; TSK-EdgeWarm/1.0; +https://github.com/jameoroi/TSKnext.js)'
          paths=(/ /products /brands /kits /news /about /contact /sitemap.xml '/api?action=site.settings' '/api?action=categories.list' '/api?action=brands.list')
          failed=0
          for path in "${paths[@]}"; do
            state=''
            for attempt in 1 2 3 4 5 6; do
              read -r status state < <(curl -sS -m 30 -A "$ua" -H "x-tsk-automation: ${AUTOMATION_TOKEN:-}" -o /dev/null -D - "${base}${path}" \
                | awk 'BEGIN{IGNORECASE=1} /^HTTP\//{s=$2} /^x-tsk-edge-cache:/{c=$2} END{gsub("\r","",c); print s, (c==""?"-":c)}')
              if [[ "$status" == "200" ]]; then break; fi
              sleep $((attempt * 5))
            done
            echo "${path} -> HTTP ${status} edge=${state} (attempts: ${attempt})"
            if [[ "$status" != "200" ]]; then
              echo "::warning::${path} still answered HTTP ${status} after ${attempt} attempts"
              failed=$((failed + 1))
            fi
          done
          if (( failed > 3 )); then
            echo "::error::${failed} key pages could not be rendered; production is likely down (error 1102)"
            exit 1
          fi

      - name: Warm a rotating slice of product pages
        # Every product page gets a last-good copy in R2 within a few hours of rotation,
        # so a shopper landing on it is answered from that copy instead of a render
        # that can exceed the Workers Free CPU limit.
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -uo pipefail
          base="${PRODUCTION_URL:-https://jayxtsk.shop}"
          base="${base%/}"
          ua='Mozilla/5.0 (compatible; TSK-EdgeWarm/1.0; +https://github.com/jameoroi/TSKnext.js)'
          curl -sS -m 60 -A "$ua" -H "x-tsk-automation: ${AUTOMATION_TOKEN:-}" "${base}/sitemap.xml" \
            | grep -oE '<loc>[^<]*/products/[^<]+</loc>' | sed -E 's#</?loc>##g' > products.txt || true
          total=$(wc -l < products.txt | tr -d ' ')
          if [[ "$total" == "0" ]]; then
            echo "::warning::sitemap returned no product URLs (bot challenge or outage); skipping"
            exit 0
          fi
          size=150
          slices=$(( (total + size - 1) / size ))
          slice=$(( RUN_NUMBER % slices ))
          start=$(( slice * size + 1 ))
          sed -n "${start},$((start + size - 1))p" products.txt > slice.txt
          echo "Warming slice $((slice + 1))/${slices}: $(wc -l < slice.txt | tr -d ' ') of ${total} product pages"
          export ua AUTOMATION_TOKEN
          warm_one() {
            for attempt in 1 2 3; do
              code=$(curl -sS -m 40 -A "$ua" -H "x-tsk-automation: ${AUTOMATION_TOKEN:-}" -o /dev/null -w '%{http_code}' "$1" || echo 000)
              [[ "$code" == "200" ]] && { echo ok; return; }
              sleep $((attempt * 3))
            done
            echo "fail $code $1"
          }
          export -f warm_one
          xargs -P 4 -I{} bash -c 'warm_one "$@"' _ {} < slice.txt > results.txt
          echo "ok: $(grep -c '^ok' results.txt) · failed: $(grep -c '^fail' results.txt)"
          grep '^fail' results.txt | head -5 || true
