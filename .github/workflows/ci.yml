name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: thaiserkit, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d thaiserkit"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thaiserkit
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-change-me
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm migration:audit
      - run: pnpm audit:source
      - run: pnpm legacy:audit --strict
      - run: pnpm audit:release
      - run: pnpm audit --audit-level=high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test -- --coverage
      - run: pnpm build

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thaiserkit
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-change-me
      APP_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: thaiserkit, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d thaiserkit"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
