name: Nightly maintenance

# Cloudflare Workers does not read vercel.json, so its cron never fired on this
# deployment. Same schedule as vercel.json: 20:15 UTC (03:15 Asia/Bangkok).
on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/maintenance
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_URL:-}" || -z "${CRON_SECRET:-}" ]]; then
            echo '::error::PRODUCTION_URL and CRON_SECRET repository secrets are required' >&2
            exit 1
          fi
          body_file="${RUNNER_TEMP}/maintenance.json"
          status="$(curl --silent --show-error --max-time 60 --output "${body_file}" --write-out '%{http_code}' \
            -X POST -H "authorization: Bearer ${CRON_SECRET}" -H "x-tsk-automation: ${AUTOMATION_TOKEN:-}" "${PRODUCTION_URL%/}/api/cron/maintenance" || true)"
          echo "HTTP ${status}"
          cat "${body_file}"; echo
          if [[ "${status}" != '200' && "${status}" != '202' ]]; then
            echo "::error::Maintenance failed: HTTP ${status}"
            exit 1
          fi
